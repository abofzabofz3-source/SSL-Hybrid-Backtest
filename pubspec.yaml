name: ssl_hybrid_backtest
description: SSL Hybrid NNFX Method Backtester for XAUUSD (Gold) Trading Strategy

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  get: ^4.6.5
  
  # Data & Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Charts & Visualization
  fl_chart: ^0.64.0
  syncfusion_flutter_charts: ^21.2.0
  
  # CSV & File Handling
  csv: ^6.0.0
  file_picker: ^5.5.0
  share_plus: ^7.0.0
  
  # API & Networking
  http: ^1.1.0
  dio: ^5.3.0
  
  # Math & Utils
  intl: ^0.19.0
  decimal: ^2.1.0
  tuple: ^2.0.1
  
  # UI Components
  flutter_spinkit: ^5.2.0
  toastification: ^1.1.0
  google_fonts: ^6.1.0
  
  # Logging
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutte:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
